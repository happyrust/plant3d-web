# Plant3D-Web Nginx 配置 (Remote Server 123.57.182.243)
# 部署路径: /etc/nginx/sites-available/plant3d-web 或 /etc/nginx/conf.d/plant3d-web.conf
#
# 2026-09-20 起唯一的后端是 gen-model（aios-database，缺省 127.0.0.1:8022）：
# `/api/v1`（模型树 + 三维模型）、`/api/review` `/api/auth` `/api/users`（校审）与 `/files/review_attachments`（附件）全在它上面。
# 旧后端 plant-model-gen web_server（:3100，parquet / GLB 的 `/files/output` `/files/meshes`）已退役，不再反代。

server {
    listen 80;
    # 2026-09-21：同一站点再听 3100。PowerPMS 那边配的模型中心地址历史上是「IP + 端口 3100」（旧 web_server 的端口），
    # 旧后端退役后 3100 没人听，PMS 的 GetZyModeInfo / GetZyModelUrl 就一直「接口连通失败」。这里让 80 与 3100 完全同一套
    # 内容（前端 + /api → gen-model），PMS 一字不改也能通；PMS 改成 80 之后这一行可以去掉。
    listen 3100;
    server_name 123.57.182.243;

    # gen-model 的部署脚本（deploy/linux/install_backend.sh）在服务器上生成的分流片段（校审域 + 附件），
    # 用通配是因为片段还没落地时 include 一个确定的文件名会让 nginx -t 直接失败——前端可以先于后端上线。
    # 片段里的 location 与下面的 `/api` 不重复：正则 location 先于前缀 location 命中。
    include /etc/nginx/snippets/aios-review-split*.conf;

    # 静态文件根目录
    root /var/www/plant3d-web;
    index index.html;

    # Vite 的入口 HTML 必须每次向服务器 revalidate，避免旧 index.html 继续引用旧 hash bundle。
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 前端应用 / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # hash 命名的静态资源可以长期缓存；文件内容变更时 Vite 会生成新文件名。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # API 反向代理：全部 /api（含 /api/v1）→ gen-model。
    # 整库 ensure / 版本对比的历史投影可能跑几十秒，读超时放宽；网格（.mesh）与 records 回包大，关掉缓冲直接流给浏览器。
    location /api {
        proxy_pass http://127.0.0.1:8022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # 校审附件下载（gen-model `PLANT_ASSET_ROOT`）。旧后端的 `/files/output`（parquet）与 `/files/meshes`（GLB）已随 legacy 退役。
    # 上面 include 的后端分流片段自带 `location ^~ /files/review_attachments/`，这里不能再写同一条（nginx 报 duplicate location）；
    # 用更短的前缀 `/files/` 兜底：片段在时它的长前缀优先，片段还没落地时附件也照样到 gen-model。
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:8022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;
}
