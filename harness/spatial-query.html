<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpatialQuery Harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #eef1f5; font-family: 'Noto Sans SC', system-ui, sans-serif; }
      .stage { display: flex; gap: 40px; padding: 40px; align-items: flex-start; flex-wrap: wrap; }
      .panel-host { position: relative; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(15,23,42,.10); }
      .cap { font: 600 13px 'Noto Sans SC'; color: #475569; margin: 0 0 10px 2px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div>
        <div class="cap">SpatialQueryDrawer · 完整模式（自动展开条件与结果）</div>
        <!-- drawer 自身 absolute right-14 top-24 定位，宿主需 relative -->
        <div id="host-sq-full" class="panel-host" style="width: 460px; height: 980px;"><div id="app-sq-full"></div></div>
      </div>
      <div>
        <div class="cap">SpatialQueryDrawer · 迷你模式</div>
        <div id="host-sq-mini" class="panel-host" style="width: 460px; height: 520px;"><div id="app-sq-mini"></div></div>
      </div>
      <div>
        <div class="cap">SpatialComputePanel · compute 档 + mock 结果</div>
        <div id="host-compute" class="panel-host" style="width: 420px; height: 980px; overflow: auto; background: #fff;"><div id="app-compute" style="height: 100%;"></div></div>
      </div>
    </div>
    <script type="module" src="/src/harness/spatialQuery.ts"></script>
  </body>
</html>
