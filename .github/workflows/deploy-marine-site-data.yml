name: Deploy Marine Site Data

on:
  push:
    tags:
      - 'marine-site-data-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the Marine payload'
        required: true
        type: string
      asset_name:
        description: 'Payload asset name'
        required: false
        default: 'marine-site-data.tar.gz'
        type: string
      remote_host:
        description: 'Override production host'
        required: false
        default: ''
        type: string
      remote_user:
        description: 'Override production user'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-marine-site-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ASSET_NAME: ${{ inputs.asset_name || 'marine-site-data.tar.gz' }}
      REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST || secrets.PROD_HOST }}
      REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || secrets.PROD_USER || 'root' }}
      REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
      PROJECT_NAME: AvevaMarineSample
      DBNUM: '7997'
      REMOTE_DB_DIR: /root/surreal_data/avevamarinesample-7997.db
      REMOTE_OUTPUT_DIR: /root/output
      REMOTE_MESH_DIR: /root/assets/meshes

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          test -n "$REMOTE_HOST" || { echo "Missing PROD_HOST or DEPLOY_REMOTE_HOST"; exit 1; }
          test -n "$REMOTE_USER" || { echo "Missing PROD_USER or DEPLOY_REMOTE_USER"; exit 1; }
          test -n "$REMOTE_PASS" || { echo "Missing DEPLOY_REMOTE_PASS"; exit 1; }

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Download payload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          shopt -s nullglob
          payload="$RUNNER_TEMP/payload/$ASSET_NAME"
          manifest="$RUNNER_TEMP/payload/$ASSET_NAME.parts"
          for attempt in $(seq 1 120); do
            rm -f "$payload" "$manifest" "$RUNNER_TEMP"/payload/"$ASSET_NAME".part-*
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" \
              --dir "$RUNNER_TEMP/payload"; then
              break
            fi

            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME.parts" \
              --dir "$RUNNER_TEMP/payload"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$ASSET_NAME.part-*" \
                --dir "$RUNNER_TEMP/payload" || true
              expected_count="$(grep '^count=' "$manifest" | cut -d= -f2)"
              actual_count="$(find "$RUNNER_TEMP/payload" -maxdepth 1 -name "$ASSET_NAME.part-*" | wc -l | tr -d ' ')"
              if [[ "$actual_count" == "$expected_count" ]]; then
                find "$RUNNER_TEMP/payload" -maxdepth 1 -name "$ASSET_NAME.part-*" -print \
                  | sort \
                  | xargs cat > "$payload"
                expected_sha="$(grep '^sha256=' "$manifest" | cut -d= -f2)"
                actual_sha="$(sha256sum "$payload" | awk '{print $1}')"
                test "$actual_sha" = "$expected_sha"
                break
              fi
              echo "Payload parts incomplete: $actual_count/$expected_count"
            fi

            echo "Payload not ready yet; retry $attempt/120"
            sleep 15
          done
          test -f "$payload"

      - name: Extract and patch DbOption
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/payload/$ASSET_NAME" -C "$RUNNER_TEMP/extracted"
          test -f "$RUNNER_TEMP/extracted/DbOption.toml"
          test -d "$RUNNER_TEMP/extracted/data/surreal.db"
          test -d "$RUNNER_TEMP/extracted/output/$PROJECT_NAME"
          test -d "$RUNNER_TEMP/extracted/assets/meshes/lod_L1"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "extracted"
          source = root / "DbOption.toml"
          target = root / "DbOption.remote.toml"
          host = os.environ["REMOTE_HOST"]
          db_dir = os.environ["REMOTE_DB_DIR"]

          section = "_root_"
          section_re = re.compile(r"^\s*\[([^\]]+)\]\s*(#.*)?$")
          replacements = {
              ("_root_", "ip"): "127.0.0.1",
              ("_root_", "project_path"): "/root/e3d_models",
              ("_root_", "meshes_path"): os.environ["REMOTE_MESH_DIR"],
              ("_root_", "output_root"): os.environ["REMOTE_OUTPUT_DIR"],
              ("_root_", "surreal_ip"): "127.0.0.1",
              ("_root_", "surreal_port"): 8020,
              ("_root_", "surreal_script_dir"): "/root/resource/surreal",
              ("model_center", "frontend_base_url"): f"http://{host}",
              ("surrealdb", "ip"): "127.0.0.1",
              ("surrealdb", "port"): 8020,
              ("surrealdb", "path"): db_dir,
              ("surrealkv", "path"): f"{db_dir}.kv",
              ("web_server", "auto_start_surreal"): False,
              ("web_server", "backend_url"): f"http://{host}",
              ("web_server", "bind_host"): "0.0.0.0",
              ("web_server", "frontend_url"): f"http://{host}",
              ("web_server", "port"): 3100,
              ("web_server", "public_base_url"): f"http://{host}",
              ("web_server", "surreal_bind"): "127.0.0.1:8020",
              ("web_server", "surreal_data_path"): db_dir,
          }

          def render(value):
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              return json.dumps(value)

          lines = []
          for line in source.read_text(encoding="utf-8").splitlines(keepends=True):
              match = section_re.match(line)
              if match and not line.lstrip().startswith("#"):
                  section = match.group(1).strip()
                  lines.append(line)
                  continue
              changed = False
              for (wanted_section, key), value in replacements.items():
                  if section == wanted_section and re.match(rf"^\s*{re.escape(key)}\s*=", line):
                      lines.append(f"{key} = {render(value)}\n")
                      changed = True
                      break
              if not changed:
                  lines.append(line)
          target.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Prepare remote
        run: |
          set -euo pipefail
          sshpass -p "$REMOTE_PASS" ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$REMOTE_USER@$REMOTE_HOST" 'sudo bash -se' <<'ENDSSH'
          set -euo pipefail
          ts="$(date +%Y%m%d_%H%M%S)"
          backup="/root/deploy-backups/marine-site-${ts}"
          mkdir -p "$backup" /root/surreal_data /root/output /root/assets/meshes /root/deploy-backups
          cp -a /root/DbOption.toml "$backup/DbOption.toml" 2>/dev/null || true
          systemctl stop web-server || true
          systemctl stop surreal-8020 || true
          systemctl stop surrealdb || true
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8020/tcp 2>/dev/null || true
          fi
          echo "backup=$backup"
          ENDSSH

      - name: Sync DB, output and meshes
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/extracted"
          ssh_args="-o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -p "$REMOTE_PASS" rsync -az --delete -e "ssh $ssh_args" --rsync-path="sudo rsync" \
            "$base/data/surreal.db/" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_DB_DIR/"
          sshpass -p "$REMOTE_PASS" rsync -az --delete -e "ssh $ssh_args" --rsync-path="sudo rsync" \
            "$base/output/" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_OUTPUT_DIR/"
          sshpass -p "$REMOTE_PASS" rsync -az --delete -e "ssh $ssh_args" --rsync-path="sudo rsync" \
            "$base/assets/meshes/" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_MESH_DIR/"
          sshpass -p "$REMOTE_PASS" rsync -az -e "ssh $ssh_args" --rsync-path="sudo rsync" \
            "$base/DbOption.remote.toml" "$REMOTE_USER@$REMOTE_HOST:/tmp/DbOption.toml"

      - name: Activate and smoke
        run: |
          set -euo pipefail
          sshpass -p "$REMOTE_PASS" ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$REMOTE_USER@$REMOTE_HOST" 'sudo bash -se' <<'ENDSSH'
          set -euo pipefail

          toml_value() {
            python3 - "$1" "$2" <<'PY'
          import sys
          import tomllib

          section, key = sys.argv[1], sys.argv[2]
          with open("/root/DbOption.toml", "rb") as fh:
              data = tomllib.load(fh)
          value = data.get(section, {}).get(key) if section else data.get(key)
          if value is None:
              raise SystemExit(f"missing toml value: {section}.{key}")
          print(value)
          PY
          }

          diagnostics() {
            echo "::group::remote diagnostics"
            echo "== systemd status =="
            systemctl status surreal-8020 web-server --no-pager || true
            echo "== surreal-8020 unit =="
            systemctl cat surreal-8020 || true
            echo "== listeners =="
            ss -tlnp | grep -E ':(8020|3100)\b' || true
            echo "== DbOption summary =="
            grep -nE '^(project_name|surreal_ns|output_root|meshes_path|project_code) =|^\[(surrealdb|web_server)\]' /root/DbOption.toml || true
            echo "== deployed dirs =="
            du -sh /root/surreal_data/avevamarinesample-7997.db /root/output/AvevaMarineSample /root/assets/meshes 2>/dev/null || true
            find /root/output/AvevaMarineSample/parquet -maxdepth 2 -type f 2>/dev/null | sort | sed -n '1,40p' || true
            find /root/assets/meshes/lod_L1 -maxdepth 1 -name '*_L1.glb' -print -quit || true
            echo "== local API =="
            curl -sS http://127.0.0.1:3100/api/status || true
            echo
            curl -sS http://127.0.0.1:3100/api/site/identity || true
            echo
            curl -sS http://127.0.0.1:3100/api/e3d/world-root || true
            echo
            curl -sS http://127.0.0.1:3100/api/e3d/visible-insts/7997_0 || true
            echo
            echo "== surreal cli =="
            if command -v surreal >/dev/null 2>&1; then
              surreal version || true
              site_surreal_user="$(toml_value web_server surreal_user 2>/dev/null || echo root)"
              site_surreal_pass="$(toml_value web_server surreal_password 2>/dev/null || echo root)"
              printf 'INFO FOR DB;\nSELECT count() AS count FROM pe GROUP ALL;\nSELECT count() AS count FROM inst_relate GROUP ALL;\nSELECT count() AS count FROM geo_relate GROUP ALL;\n' \
                | surreal sql --conn http://127.0.0.1:8020 --user "$site_surreal_user" --pass "$site_surreal_pass" --ns 1 --db AvevaMarineSample --pretty || true
            else
              echo "surreal CLI not found"
            fi
            echo "== recent logs =="
            journalctl -u surreal-8020 -n 120 --no-pager || true
            journalctl -u web-server -n 160 --no-pager || true
            echo "::endgroup::"
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then diagnostics; fi; exit "$rc"' EXIT

          mv /tmp/DbOption.toml /root/DbOption.toml
          mkdir -p /root/shells /etc/systemd/system/surreal-8020.service.d
          cat > /root/shells/run_surreal_8020_ubuntu.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SURREAL_USER="${SURREAL_USER:-root}"
          SURREAL_PASS="${SURREAL_PASS:-root}"
          BIND="${SURREAL_BIND:-0.0.0.0:8020}"
          DATA_DIR="${REMOTE_SURREAL_DATA_DIR:-/root/surreal_data}"
          DB_DIR_NAME="${SURREAL_DB_DIR_NAME:-ams-8020.db}"
          SURREAL_BIN="${SURREAL_BIN:-surreal}"
          exec "$SURREAL_BIN" start --user "$SURREAL_USER" --pass "$SURREAL_PASS" --bind "$BIND" "rocksdb://${DATA_DIR}/${DB_DIR_NAME}"
          EOF
          chmod +x /root/shells/run_surreal_8020_ubuntu.sh

          surreal_bin="$(command -v surreal || true)"
          if [ -x /usr/local/bin/surreal ]; then
            surreal_bin=/usr/local/bin/surreal
          elif [ -x /usr/bin/surreal ]; then
            surreal_bin=/usr/bin/surreal
          fi
          test -n "$surreal_bin"
          site_surreal_user="$(toml_value web_server surreal_user)"
          site_surreal_pass="$(toml_value web_server surreal_password)"

          cat > /etc/systemd/system/surreal-8020.service <<EOF
          [Unit]
          Description=SurrealDB plant (8020, rocksdb, AvevaMarineSample 7997)
          After=network-online.target
          Wants=network-online.target
          Conflicts=surrealdb.service

          [Service]
          Type=simple
          WorkingDirectory=/root/surreal_data
          Environment=REMOTE_SURREAL_DATA_DIR=/root/surreal_data
          Environment=SURREAL_DB_DIR_NAME=avevamarinesample-7997.db
          Environment="SURREAL_USER=$site_surreal_user"
          Environment="SURREAL_PASS=$site_surreal_pass"
          Environment=SURREAL_BIND=0.0.0.0:8020
          Environment=SURREAL_BIN=$surreal_bin
          ExecStart=/root/shells/run_surreal_8020_ubuntu.sh
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl stop surrealdb || true
          systemctl enable surreal-8020
          systemctl restart surreal-8020
          systemctl restart web-server
          nginx -t && systemctl reload nginx || true

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/api/status >/tmp/plant3d-status.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/plant3d-status.json
          curl -fsS http://127.0.0.1:3100/api/projects
          curl -fsSI http://127.0.0.1:3100/files/output/AvevaMarineSample/parquet/manifest_7997.json
          first_mesh="$(find /root/assets/meshes/lod_L1 -maxdepth 1 -name '*_L1.glb' -print -quit)"
          test -n "$first_mesh"
          mesh_name="$(basename "$first_mesh")"
          curl -fsSI "http://127.0.0.1:3100/files/meshes/lod_L1/$mesh_name"
          curl -fsS http://127.0.0.1:3100/api/e3d/world-root >/tmp/plant3d-world-root.json
          curl -fsS http://127.0.0.1:3100/api/e3d/visible-insts/7997_0 >/tmp/plant3d-visible.json
          cat /tmp/plant3d-visible.json
          python3 - <<'PY'
          import json

          visible = json.load(open("/tmp/plant3d-visible.json", encoding="utf-8"))
          if visible.get("success") is not True:
              raise SystemExit(f"visible-insts failed: {visible}")
          PY
          systemctl is-active surreal-8020
          systemctl is-active web-server
          ENDSSH
