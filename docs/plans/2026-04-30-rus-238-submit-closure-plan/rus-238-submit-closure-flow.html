<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUS-238 提交收敛流程图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef2f6;
      --paper-2: #f8fbfe;
      --ink: #21364d;
      --muted: #6b7f95;
      --soft: #8aa0b6;
      --rule: rgba(33, 54, 77, 0.12);
      --rule-solid: rgba(33, 54, 77, 0.24);
      --accent: #2d67b2;
      --accent-tint: rgba(45, 103, 178, 0.10);
      --link: #1f4f8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Geist", system-ui, sans-serif;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 40px;
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 760px;
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .canvas {
      overflow-x: auto;
      border: 1px solid var(--rule-solid);
      border-radius: 10px;
      background: var(--paper-2);
    }

    svg {
      display: block;
      min-width: 960px;
      height: auto;
    }

    .eyebrow {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .node-name {
      font-size: 13px;
      font-weight: 600;
      fill: var(--ink);
    }

    .sub {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 9px;
      fill: var(--muted);
    }

    .arrow-label {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 9px;
      fill: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <h1>RUS-238 提交收敛流程</h1>
    <p class="lead">
      目标是把已经通过验证的 RUS-238 restore / approved / automation hook 改动收敛成一个可审查提交，同时避免把工作区已有大量无关变更混入。
    </p>

    <div class="canvas" aria-label="RUS-238 提交收敛流程图">
      <svg viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
        <title id="title">RUS-238 提交收敛流程图</title>
        <desc id="desc">从已验证状态开始，经过提交边界复核、验证门禁、文档证据、用户授权、提交或等待。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(33,54,77,0.10)" />
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7f95" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2d67b2" />
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1f4f8d" />
          </marker>
        </defs>

        <rect width="960" height="720" fill="#eef2f6" />
        <rect width="960" height="720" fill="url(#dots)" opacity="0.48" />
        <rect x="32" y="32" width="896" height="656" rx="10" fill="#f8fbfe" stroke="rgba(33,54,77,0.24)" />

        <!-- arrows -->
        <path d="M480 104 L480 144" stroke="#6b7f95" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
        <path d="M480 224 L480 264" stroke="#6b7f95" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
        <path d="M480 344 L480 384" stroke="#6b7f95" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
        <path d="M480 464 L480 504" stroke="#2d67b2" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)" />
        <path d="M560 544 L720 544 L720 592" stroke="#1f4f8d" stroke-width="1.5" fill="none" marker-end="url(#arrow-link)" />
        <path d="M400 544 L240 544 L240 592" stroke="#6b7f95" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,4" />

        <rect x="496" y="237" width="72" height="16" rx="3" fill="#f8fbfe" />
        <text x="532" y="248" class="arrow-label" text-anchor="middle">focused diff</text>
        <rect x="496" y="357" width="80" height="16" rx="3" fill="#f8fbfe" />
        <text x="536" y="368" class="arrow-label" text-anchor="middle">验证门禁</text>
        <rect x="616" y="524" width="92" height="16" rx="3" fill="#f8fbfe" />
        <text x="662" y="535" class="arrow-label" text-anchor="middle">已授权提交</text>
        <rect x="252" y="524" width="100" height="16" rx="3" fill="#f8fbfe" />
        <text x="302" y="535" class="arrow-label" text-anchor="middle">未授权提交</text>

        <!-- start -->
        <rect x="330" y="64" width="300" height="40" rx="20" fill="rgba(107,127,149,0.10)" stroke="#8aa0b6" />
        <text x="480" y="88" class="node-name" text-anchor="middle">开始：RUS-238 已验证</text>

        <!-- step 1 -->
        <rect x="316" y="144" width="328" height="80" rx="6" fill="#ffffff" stroke="#21364d" />
        <rect x="328" y="156" width="34" height="14" rx="2" fill="transparent" stroke="rgba(33,54,77,0.40)" />
        <text x="345" y="166" class="eyebrow" text-anchor="middle" fill="#21364d">PLAN</text>
        <text x="480" y="184" class="node-name" text-anchor="middle">提交边界复核</text>
        <text x="480" y="202" class="sub" text-anchor="middle">只允许 focused paths；禁止 git add .</text>

        <!-- step 2 -->
        <rect x="316" y="264" width="328" height="80" rx="6" fill="#ffffff" stroke="#21364d" />
        <rect x="328" y="276" width="34" height="14" rx="2" fill="transparent" stroke="rgba(33,54,77,0.40)" />
        <text x="345" y="286" class="eyebrow" text-anchor="middle" fill="#21364d">GATE</text>
        <text x="480" y="304" class="node-name" text-anchor="middle">验证门禁</text>
        <text x="480" y="322" class="sub" text-anchor="middle">eslint / type-check / unit / restore / approved</text>

        <!-- step 3 -->
        <rect x="316" y="384" width="328" height="80" rx="6" fill="rgba(45,103,178,0.10)" stroke="#2d67b2" stroke-width="1.2" />
        <rect x="328" y="396" width="34" height="14" rx="2" fill="transparent" stroke="rgba(45,103,178,0.50)" />
        <text x="345" y="406" class="eyebrow" text-anchor="middle" fill="#2d67b2">DOC</text>
        <text x="480" y="424" class="node-name" text-anchor="middle">文档与证据收敛</text>
        <text x="480" y="442" class="sub" text-anchor="middle">progress / findings / reports 可复核</text>

        <!-- decision diamond -->
        <polygon points="480,504 560,544 480,584 400,544" fill="#ffffff" stroke="#21364d" stroke-width="1.2" />
        <text x="480" y="540" class="node-name" text-anchor="middle">用户是否</text>
        <text x="480" y="558" class="node-name" text-anchor="middle">授权提交？</text>

        <!-- wait -->
        <rect x="132" y="592" width="216" height="64" rx="6" fill="rgba(33,54,77,0.02)" stroke="rgba(33,54,77,0.20)" stroke-dasharray="4,3" />
        <rect x="144" y="604" width="36" height="14" rx="2" fill="transparent" stroke="rgba(33,54,77,0.30)" />
        <text x="162" y="614" class="eyebrow" text-anchor="middle" fill="#6b7f95">WAIT</text>
        <text x="240" y="628" class="node-name" text-anchor="middle">保持规划状态</text>
        <text x="240" y="646" class="sub" text-anchor="middle">不提交；等待明确指令</text>

        <!-- commit -->
        <rect x="612" y="592" width="216" height="64" rx="6" fill="#ffffff" stroke="#1f4f8d" />
        <rect x="624" y="604" width="42" height="14" rx="2" fill="transparent" stroke="rgba(31,79,141,0.45)" />
        <text x="645" y="614" class="eyebrow" text-anchor="middle" fill="#1f4f8d">GIT</text>
        <text x="720" y="628" class="node-name" text-anchor="middle">显式暂存并提交</text>
        <text x="720" y="646" class="sub" text-anchor="middle">Conventional Commit；按需 push / PR</text>

        <!-- callout -->
        <path d="M656 186 C728 172, 764 152, 808 120" stroke="#2d67b2" stroke-width="1.2" fill="none" stroke-dasharray="4,4" />
        <text x="808" y="102" fill="#2d67b2" font-family="'Instrument Serif', serif" font-size="16" font-style="italic" text-anchor="middle">关键约束</text>
        <text x="808" y="122" class="sub" text-anchor="middle">脏工作区内只做显式路径提交</text>
      </svg>
    </div>
  </main>
</body>
</html>
