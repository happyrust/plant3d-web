<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUS-238 Review 查询稳定化架构图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef2f6;
      --paper-2: #f8fbfe;
      --ink: #21364d;
      --muted: #6b7f95;
      --soft: #8aa0b6;
      --rule: rgba(33, 54, 77, 0.12);
      --rule-solid: rgba(33, 54, 77, 0.24);
      --accent: #2d67b2;
      --accent-tint: rgba(45, 103, 178, 0.10);
      --link: #1f4f8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Geist", system-ui, sans-serif;
    }

    main {
      width: min(1120px, calc(100vw - 48px));
      margin: 40px auto;
      padding: 28px;
      background: var(--paper-2);
      border: 1px solid var(--rule-solid);
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: "Instrument Serif", serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 760px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
    }

    .title {
      font-family: "Instrument Serif", serif;
      font-size: 28px;
      font-weight: 400;
      fill: var(--ink);
    }

    .tag {
      font-family: "Geist Mono", monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .node-name {
      font-family: "Geist", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: var(--ink);
    }

    .sub {
      font-family: "Geist Mono", monospace;
      font-size: 9px;
      fill: var(--muted);
    }

    .label {
      font-family: "Geist Mono", monospace;
      font-size: 8px;
      fill: var(--muted);
      letter-spacing: 0.06em;
    }

    .callout {
      font-family: "Instrument Serif", serif;
      font-size: 16px;
      font-style: italic;
      fill: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <h1>RUS-238 Review 查询稳定化架构图</h1>
    <p class="lede">
      目标是让仿 PMS 新建单据重开时稳定恢复 review 记录，避免页面进入阶段命中已挂起的池化 SurrealDB ws client。
      本图展示用户可见链路、短连接读路径，以及后续仍需治理的连接池风险。
    </p>

    <svg viewBox="0 0 1040 620" role="img" aria-label="RUS-238 Review 查询稳定化架构图">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(33,54,77,0.10)" />
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6b7f95" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2d67b2" />
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1f4f8d" />
        </marker>
      </defs>

      <rect width="1040" height="620" fill="#eef2f6" />
      <rect width="1040" height="620" fill="url(#dots)" opacity="0.48" />

      <text x="32" y="48" class="title">新建单据可见性恢复路径</text>
      <text x="32" y="72" class="sub">FORM-37C372A7407F · task-1104fb4f-8787-4ff9-9aee-3125ecb452ff · BRAN 24381_145018</text>

      <!-- Boundaries -->
      <rect x="32" y="104" width="276" height="316" rx="8" fill="transparent" stroke="rgba(33,54,77,0.24)" stroke-dasharray="4 4" />
      <rect x="48" y="96" width="76" height="18" rx="2" fill="#eef2f6" />
      <text x="56" y="109" class="tag" fill="#6b7f95">FRONTEND</text>

      <rect x="368" y="104" width="308" height="316" rx="8" fill="transparent" stroke="rgba(45,103,178,0.45)" stroke-dasharray="4 4" />
      <rect x="384" y="96" width="80" height="18" rx="2" fill="#eef2f6" />
      <text x="392" y="109" class="tag" fill="#2d67b2">BACKEND</text>

      <rect x="736" y="104" width="272" height="316" rx="8" fill="transparent" stroke="rgba(33,54,77,0.24)" stroke-dasharray="4 4" />
      <rect x="752" y="96" width="92" height="18" rx="2" fill="#eef2f6" />
      <text x="760" y="109" class="tag" fill="#6b7f95">SURREALDB</text>

      <!-- Arrows behind nodes -->
      <path d="M252 184 H388" fill="none" stroke="#1f4f8d" stroke-width="1.2" marker-end="url(#arrow-link)" />
      <rect x="296" y="168" width="48" height="14" rx="2" fill="#eef2f6" />
      <text x="320" y="178" class="label" text-anchor="middle">HTTP</text>

      <path d="M636 184 H760" fill="none" stroke="#2d67b2" stroke-width="1.2" marker-end="url(#arrow-accent)" />
      <rect x="668" y="168" width="60" height="14" rx="2" fill="#eef2f6" />
      <text x="698" y="178" class="label" text-anchor="middle">FRESH WS</text>

      <path d="M760 296 H636" fill="none" stroke="#6b7f95" stroke-width="1" marker-end="url(#arrow)" />
      <rect x="672" y="280" width="52" height="14" rx="2" fill="#eef2f6" />
      <text x="698" y="290" class="label" text-anchor="middle">JSON</text>

      <path d="M388 296 H252" fill="none" stroke="#6b7f95" stroke-width="1" marker-end="url(#arrow)" />
      <rect x="292" y="280" width="56" height="14" rx="2" fill="#eef2f6" />
      <text x="320" y="290" class="label" text-anchor="middle">RENDER</text>

      <path d="M520 356 C520 392 760 392 760 348" fill="none" stroke="#6b7f95" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)" />
      <rect x="604" y="380" width="72" height="14" rx="2" fill="#eef2f6" />
      <text x="640" y="390" class="label" text-anchor="middle">POOL RISK</text>

      <!-- Frontend nodes -->
      <g>
        <rect x="68" y="144" width="184" height="80" rx="6" fill="#eef2f6" />
        <rect x="68" y="144" width="184" height="80" rx="6" fill="#ffffff" stroke="#21364d" stroke-width="1" />
        <rect x="80" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(33,54,77,0.40)" stroke-width="0.8" />
        <text x="96" y="165" class="tag" fill="#21364d" text-anchor="middle">PMS</text>
        <text x="160" y="184" class="node-name" text-anchor="middle">仿 PMS 新建单据</text>
        <text x="160" y="202" class="sub" text-anchor="middle">form + task + token</text>
      </g>

      <g>
        <rect x="68" y="256" width="184" height="96" rx="6" fill="#eef2f6" />
        <rect x="68" y="256" width="184" height="96" rx="6" fill="#ffffff" stroke="#21364d" stroke-width="1" />
        <rect x="80" y="268" width="32" height="12" rx="2" fill="transparent" stroke="rgba(33,54,77,0.40)" stroke-width="0.8" />
        <text x="96" y="277" class="tag" fill="#21364d" text-anchor="middle">UI</text>
        <text x="160" y="300" class="node-name" text-anchor="middle">Plant3D 校审面板</text>
        <text x="160" y="318" class="sub" text-anchor="middle">records · comments · workflow</text>
        <text x="160" y="336" class="sub" text-anchor="middle">RefNo 24381/145018, 24381_145018</text>
      </g>

      <!-- Backend nodes -->
      <g>
        <rect x="388" y="144" width="248" height="80" rx="6" fill="#eef2f6" />
        <rect x="388" y="144" width="248" height="80" rx="6" fill="rgba(45,103,178,0.10)" stroke="#2d67b2" stroke-width="1.2" />
        <rect x="400" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,103,178,0.48)" stroke-width="0.8" />
        <text x="416" y="165" class="tag" fill="#2d67b2" text-anchor="middle">API</text>
        <text x="512" y="184" class="node-name" text-anchor="middle">Review 读接口</text>
        <text x="512" y="202" class="sub" text-anchor="middle">task · records · comments · workflow</text>
      </g>

      <g>
        <rect x="388" y="256" width="248" height="100" rx="6" fill="#eef2f6" />
        <rect x="388" y="256" width="248" height="100" rx="6" fill="rgba(45,103,178,0.10)" stroke="#2d67b2" stroke-width="1.2" />
        <rect x="400" y="268" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,103,178,0.48)" stroke-width="0.8" />
        <text x="422" y="277" class="tag" fill="#2d67b2" text-anchor="middle">FIX</text>
        <text x="512" y="300" class="node-name" text-anchor="middle">fresh_review_db()</text>
        <text x="512" y="318" class="sub" text-anchor="middle">per request ws client</text>
        <text x="512" y="336" class="sub" text-anchor="middle">signin + use ns/db</text>
      </g>

      <!-- Data nodes -->
      <g>
        <rect x="760" y="144" width="208" height="80" rx="6" fill="#eef2f6" />
        <rect x="760" y="144" width="208" height="80" rx="6" fill="rgba(33,54,77,0.05)" stroke="#6b7f95" stroke-width="1" />
        <rect x="772" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(107,127,149,0.48)" stroke-width="0.8" />
        <text x="788" y="165" class="tag" fill="#6b7f95" text-anchor="middle">DB</text>
        <text x="864" y="184" class="node-name" text-anchor="middle">Review 数据表</text>
        <text x="864" y="202" class="sub" text-anchor="middle">tasks · records · comments</text>
      </g>

      <g>
        <rect x="760" y="268" width="208" height="80" rx="6" fill="#eef2f6" />
        <rect x="760" y="268" width="208" height="80" rx="6" fill="rgba(33,54,77,0.02)" stroke="rgba(33,54,77,0.20)" stroke-width="1" stroke-dasharray="4 3" />
        <rect x="772" y="280" width="44" height="12" rx="2" fill="transparent" stroke="rgba(107,127,149,0.36)" stroke-width="0.8" />
        <text x="794" y="289" class="tag" fill="#6b7f95" text-anchor="middle">POOL</text>
        <text x="864" y="308" class="node-name" text-anchor="middle">旧池化 ws client</text>
        <text x="864" y="326" class="sub" text-anchor="middle">保留写路径 · 后续治理</text>
      </g>

      <!-- Callout -->
      <path d="M632 256 C688 232 720 220 760 208" fill="none" stroke="#2d67b2" stroke-width="1" stroke-dasharray="4 4" />
      <text x="592" y="244" class="callout">关键变化：读路径不再复用可能挂起的池连接。</text>

      <!-- Validation strip -->
      <line x1="32" y1="464" x2="1008" y2="464" stroke="rgba(33,54,77,0.12)" stroke-width="0.8" />
      <text x="32" y="496" class="tag" fill="#6b7f95">VALIDATION</text>
      <text x="156" y="496" class="sub">cargo check/build 通过</text>
      <circle cx="136" cy="492" r="4" fill="#2d67b2" />
      <text x="360" y="496" class="sub">direct API 全部 200</text>
      <circle cx="340" cy="492" r="4" fill="#2d67b2" />
      <text x="568" y="496" class="sub">browser 可见批注 1 / 测量 1</text>
      <circle cx="548" cy="492" r="4" fill="#2d67b2" />
      <text x="820" y="496" class="sub">RefNo 双格式显示</text>
      <circle cx="800" cy="492" r="4" fill="#2d67b2" />

      <line x1="32" y1="544" x2="1008" y2="544" stroke="rgba(33,54,77,0.12)" stroke-width="0.8" />
      <text x="32" y="572" class="tag" fill="#6b7f95">NEXT</text>
      <text x="156" y="572" class="sub">提交前确认跨仓 diff 边界；长期方案再补连接池健康检查与熔断恢复。</text>
    </svg>
  </main>
</body>
</html>
