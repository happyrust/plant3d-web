<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800">
  <style>
    text { font-family: -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .node-label { font-size: 13px; fill: #1e293b; font-weight: 600; }
    .node-desc { font-size: 11px; fill: #64748b; }
    .arrow-label { font-size: 10px; fill: #475569; }
    .layer-label { font-size: 14px; fill: #94a3b8; font-weight: 600; }
    .legend-text { font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c" />
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="960" height="800" fill="#f8fafc" />
  <text x="480" y="32" text-anchor="middle" class="title">RUS-241 审批同意流程架构</text>
  <text x="480" y="50" text-anchor="middle" class="subtitle">PMS → 仿 PMS 模拟器 → plant3d-web 前端 → plant-model-gen 后端</text>

  <rect x="30" y="70" width="900" height="110" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,3" />
  <text x="50" y="90" class="layer-label">外部平台层</text>
  <rect x="60" y="100" width="180" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd" filter="url(#shadow)" />
  <text x="150" y="126" text-anchor="middle" class="node-label">真实 PMS</text>
  <text x="150" y="142" text-anchor="middle" class="node-desc">user_id=SJ/JH/SH/PZ</text>
  <rect x="280" y="100" width="280" height="60" rx="8" fill="#fef3c7" stroke="#fcd34d" filter="url(#shadow)" />
  <text x="420" y="126" text-anchor="middle" class="node-label">仿 PMS 模拟器</text>
  <text x="420" y="142" text-anchor="middle" class="node-desc">pmsReviewSimulator.ts + 诊断面板</text>
  <rect x="600" y="100" width="180" height="60" rx="8" fill="#e0e7ff" stroke="#a5b4fc" filter="url(#shadow)" />
  <text x="690" y="126" text-anchor="middle" class="node-label">embed-url 入口</text>
  <text x="690" y="142" text-anchor="middle" class="node-desc">token + workflow_role</text>

  <rect x="30" y="200" width="900" height="130" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,3" />
  <text x="50" y="220" class="layer-label">前端 API 契约层</text>
  <rect x="60" y="235" width="240" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7" filter="url(#shadow)" />
  <text x="180" y="260" text-anchor="middle" class="node-label">reviewApi.ts</text>
  <text x="180" y="276" text-anchor="middle" class="node-desc">reviewVerifyWorkflow()</text>
  <text x="180" y="292" text-anchor="middle" class="node-desc">+ WorkflowNextStepDetail</text>
  <rect x="340" y="235" width="240" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7" filter="url(#shadow)" />
  <text x="460" y="260" text-anchor="middle" class="node-label">reviewPanelActions.ts</text>
  <text x="460" y="276" text-anchor="middle" class="node-desc">runReviewSubmitPreflight()</text>
  <text x="460" y="292" text-anchor="middle" class="node-desc">resolveReviewSubmitErrorMessage()</text>
  <rect x="620" y="235" width="280" height="80" rx="8" fill="#fef9c3" stroke="#fde047" filter="url(#shadow)" />
  <text x="760" y="260" text-anchor="middle" class="node-label">pmsPlatformContractPayloads.ts</text>
  <text x="760" y="276" text-anchor="middle" class="node-desc">buildWorkflowSyncPayload()</text>
  <text x="760" y="292" text-anchor="middle" class="node-desc">actor.id = HumanCode</text>

  <rect x="30" y="350" width="900" height="190" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,3" />
  <text x="50" y="370" class="layer-label">后端校验层 (Rust / Axum)</text>
  <rect x="60" y="385" width="260" height="140" rx="8" fill="#fce7f3" stroke="#f9a8d4" filter="url(#shadow)" />
  <text x="190" y="408" text-anchor="middle" class="node-label">verify_workflow_handler</text>
  <text x="190" y="425" text-anchor="middle" class="node-desc">validate_workflow_agree()</text>
  <text x="190" y="442" text-anchor="middle" class="node-desc">ensure_owner_matches()</text>
  <text x="190" y="459" text-anchor="middle" class="node-desc">evaluate_annotation_check()</text>
  <text x="190" y="478" text-anchor="middle" class="node-desc" font-weight="bold" fill="#dc2626">→ VerifyWorkflowData</text>
  <text x="190" y="495" text-anchor="middle" class="node-desc">block_code / actor_id / owner_id</text>
  <text x="190" y="510" text-anchor="middle" class="node-desc">requested_next_step</text>
  <rect x="360" y="385" width="200" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5" filter="url(#shadow)" />
  <text x="460" y="410" text-anchor="middle" class="node-label">normalize_pms_human_code</text>
  <text x="460" y="428" text-anchor="middle" class="node-desc">trim + 大写 + 白名单</text>
  <text x="460" y="446" text-anchor="middle" class="node-desc">SJ / JH / SH / PZ</text>
  <rect x="600" y="385" width="300" height="140" rx="8" fill="#ede9fe" stroke="#c4b5fd" filter="url(#shadow)" />
  <text x="750" y="408" text-anchor="middle" class="node-label">sync_workflow_handler</text>
  <text x="750" y="425" text-anchor="middle" class="node-desc">apply_workflow_agree()</text>
  <text x="750" y="442" text-anchor="middle" class="node-desc">→ SyncWorkflowData</text>
  <text x="750" y="459" text-anchor="middle" class="node-desc" font-weight="bold" fill="#059669">+ next_step_detail</text>
  <text x="750" y="476" text-anchor="middle" class="node-desc">{node, roles, assignee_id,</text>
  <text x="750" y="493" text-anchor="middle" class="node-desc">assignee_name}</text>

  <rect x="30" y="560" width="900" height="100" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,3" />
  <text x="50" y="580" class="layer-label">数据层 (SurrealDB)</text>
  <rect x="60" y="595" width="200" height="50" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="160" y="625" text-anchor="middle" class="node-label">review_tasks</text>
  <rect x="300" y="595" width="200" height="50" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="400" y="625" text-anchor="middle" class="node-label">review_forms</text>
  <rect x="540" y="595" width="200" height="50" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="640" y="625" text-anchor="middle" class="node-label">review_records</text>
  <rect x="780" y="595" width="120" height="50" rx="16" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="840" y="625" text-anchor="middle" class="node-desc">annotation_states</text>

  <line x1="240" y1="130" x2="278" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <line x1="560" y1="130" x2="598" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <line x1="420" y1="160" x2="180" y2="233" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />
  <rect x="260" y="185" width="80" height="16" fill="#f8fafc" opacity="0.95" rx="3" />
  <text x="300" y="196" text-anchor="middle" class="arrow-label">verify</text>
  <line x1="500" y1="160" x2="760" y2="233" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />
  <rect x="610" y="185" width="60" height="16" fill="#f8fafc" opacity="0.95" rx="3" />
  <text x="640" y="196" text-anchor="middle" class="arrow-label">sync</text>
  <line x1="180" y1="315" x2="190" y2="383" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="140" y="340" width="100" height="16" fill="#f8fafc" opacity="0.95" rx="3" />
  <text x="190" y="351" text-anchor="middle" class="arrow-label">POST /verify</text>
  <line x1="760" y1="315" x2="750" y2="383" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="700" y="340" width="90" height="16" fill="#f8fafc" opacity="0.95" rx="3" />
  <text x="745" y="351" text-anchor="middle" class="arrow-label">POST /sync</text>
  <line x1="320" y1="425" x2="358" y2="425" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)" />
  <line x1="560" y1="425" x2="598" y2="425" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)" />
  <line x1="190" y1="525" x2="160" y2="593" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr-blue)" />
  <line x1="750" y1="525" x2="640" y2="593" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr-blue)" />

  <rect x="30" y="680" width="900" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <text x="50" y="702" class="node-label">图例</text>
  <line x1="50" y1="720" x2="100" y2="720" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="110" y="724" class="legend-text">数据流（请求/响应）</text>
  <line x1="260" y1="720" x2="310" y2="720" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />
  <text x="320" y="724" class="legend-text">API 调用（verify/sync）</text>
  <line x1="490" y1="720" x2="540" y2="720" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)" />
  <text x="550" y="724" class="legend-text">身份校验（HumanCode 规范化）</text>
  <line x1="760" y1="720" x2="810" y2="720" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr-blue)" />
  <text x="820" y="724" class="legend-text">DB 查询</text>
  <rect x="50" y="740" width="12" height="12" rx="2" fill="#fce7f3" stroke="#f9a8d4" />
  <text x="70" y="750" class="legend-text">RUS-241 新增诊断字段（block_code / actor_id / owner_id / next_step_detail）</text>
  <rect x="520" y="740" width="12" height="12" rx="2" fill="#fef2f2" stroke="#fca5a5" />
  <text x="540" y="750" class="legend-text">RUS-241 新增身份校验（normalize_pms_human_code + 白名单 SJ/JH/SH/PZ）</text>

</svg>