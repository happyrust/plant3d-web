<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">RUS-241 Workflow Agree Architecture</title>
  <desc id="desc">Architecture diagram for the PMS agree action, frontend verify step, backend gates, sync mutation, and persisted review state.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .lane-label { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
    .node-title { font-size: 14px; font-weight: 700; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .small { font-size: 10px; fill: #6b7280; }
    .arrow-label { font-size: 11px; font-weight: 600; fill: #374151; }
  </style>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
