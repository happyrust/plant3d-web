<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E3D 渲染效果复刻原型（SGL DX11 口径）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px/1.4 system-ui, "Microsoft YaHei", sans-serif; }
    #app { display: flex; height: 100%; }
    #viewport { flex: 1 1 auto; min-width: 0; position: relative; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    #panel { flex: 0 0 330px; overflow-y: auto; padding: 10px 12px; background: #1b1f24; border-left: 1px solid #333; }
    #panel h1 { font-size: 14px; margin: 0 0 6px; }
    #panel h2 { font-size: 12px; margin: 12px 0 4px; color: #9cc; }
    #panel .stats { color: #8a8; font-family: ui-monospace, Consolas, monospace; margin-bottom: 6px; }
    #panel .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #panel .row .name { flex: 0 0 120px; color: #bbb; }
    #panel .row .val { flex: 0 0 48px; text-align: right; font-family: ui-monospace, Consolas, monospace; color: #ddd; }
    #panel input[type=range] { flex: 1 1 auto; min-width: 0; }
    #panel button { background: #2a3440; color: #ddd; border: 1px solid #456; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
    #panel button:hover { background: #35424f; }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>
    <div id="panel"></div>
  </div>
  <script type="module" src="/src/viewer/e3dLook/demo/e3dLookDemo.ts"></script>
</body>
</html>
